services:
  redis:
    image: redis:7


  api:
    build: .
    command: ./api
    ports:
      - "8080:8080"
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      - redis

  worker:
    build: .
    command: ./worker
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      - redis

  reaper:
    build: .
    command: ./reaper
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      - redis